<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiftFolio · Mi colección de Riftbound</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23f0c05a'/%3E%3Cstop offset='1' stop-color='%235ee7e0'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='14' fill='%230a0c1a'/%3E%3Cpath d='M16 4 27 10v12L16 28 5 22V10Z' fill='none' stroke='url(%23g)' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stylesheets/styles.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="rune"></div>
      <div>
        <span>RiftFolio</span>
        <small>Riftbound TCG</small>
      </div>
    </div>

    <nav>
      <button data-view="search" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        Buscador
      </button>
      <button data-view="collection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Mi colección
      </button>
      <button data-view="decks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5a2 2 0 0 1 2-2h8.5L20 7.5V19a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/><path d="M14 3v5h5"/></svg>
        Mazos
      </button>
    </nav>
    <div class="data-actions">
      <button class="btn btn-ghost btn-sm btn-full" id="export-btn">⭳ Exportar copia</button>
      <button class="btn btn-ghost btn-sm btn-full" id="import-btn">⭱ Importar copia</button>
      <input type="file" id="import-input" accept="application/json" hidden>
    </div>

  </aside>

  <main id="main"></main>
</div>

<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
